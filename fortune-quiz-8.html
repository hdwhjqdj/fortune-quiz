    </div>

<script>
var CONFIG = {
  fullUrl: "fortune-quiz.html"
};

/* 8 题：4 维各 1 题 + 表达倾向 4 题 */
var QUESTIONS = [
  /* habit */
  { text:"每月生活费发下来，你通常会：", options:[
    { text:"先存 20-30%，花剩下的", score:2 },
    { text:"花到月底，能剩多少算多少", score:1 },
    { text:"有多少花多少，月光也无所谓", score:0 }
  ]},
  /* opport */
  { text:"刷到有人靠小红书接广告月入过万，你会：", options:[
    { text:"收藏研究，试试能不能从自己的爱好入手", score:2 },
    { text:"羡慕一下，然后继续刷", score:1 },
    { text:"觉得是别人的事，跟我没关系", score:0 }
  ]},
  /* risk */
  { text:"如果一个项目有 50% 概率赚 3000，50% 概率亏 1000，你会：", options:[
    { text:"敢试，盈亏比合适", score:2 },
    { text:"犹豫，但可能会试试", score:1 },
    { text:"不冒这个险", score:0 }
  ]},
  /* action */
  { text:"想到一个赚钱的小点子后，你通常：", options:[
    { text:"当天就动手做一个最小版本", score:2 },
    { text:"想一周再说", score:1 },
    { text:"想想就算了", score:0 }
  ]},
  /* expr */
  { text:"你觉得自己「有赚钱的潜力但还没发挥」吗？", options:[
    { text:"是，我知道自己可以", score:2 },
    { text:"可能是吧", score:1 },
    { text:"不太觉得", score:0 }
  ]},
  { text:"你对「什么时候能发财」的态度是：", options:[
    { text:"我在创造条件，它会来", score:2 },
    { text:"等机会吧", score:1 },
    { text:"随缘，不强求", score:0 }
  ]},
  { text:"别人说「你不像会赚钱的人」，你会：", options:[
    { text:"不服气，暗自发力", score:2 },
    { text:"有点被戳中", score:1 },
    { text:"无所谓，我开心最重要", score:0 }
  ]},
  { text:"对于赚钱，你觉得自己还缺什么？", options:[
    { text:"一个明确的方向 + 行动力", score:2 },
    { text:"运气和机会", score:1 },
    { text:"可能什么都不缺，只是不想太拼", score:0 }
  ]}
];

/* 四型文案（精简版） */
var TYPES = {
  jh: {
    key:"jh", name:"机会猎手型", tag:"敢想敢干能抓住",
    quote:"“机会不是等来的，是逛出来的。”",
    desc:"你对机会敏感，行动力强。第一笔副业收入大概率在 1-2 年内出现。",
    fullMore:"18 题完整版里会告诉你：你最擅长哪种赚钱方式、发财时间窗口有多具体、以及本周就能做的 3 件加速清单。"
  },
  wz: {
    key:"wz", name:"稳扎稳打型", tag:"默默攒钱不动声色",
    quote:"“我不碰赚快钱的机会，但我不会一直穷。”",
    desc:"你对钱有控制力，靠积少成多。3-5 年内能攒下第一笔像样的钱。",
    fullMore:"18 题完整版里会告诉你：你的风险承受度具体在哪、最低的一维短板是什么、以及适合你的低风险存钱方式。"
  },
  kx: {
    key:"kx", name:"空想选手型", tag:"想法多但不动手",
    quote:"“我想过好多种赚钱方式，就是没开始过。”",
    desc:"你最大的阻碍是想得太久。先别问什么时候能赚，先把「开始做」完成。",
    fullMore:"18 题完整版里会告诉你：你卡在哪一步、怎么把大想法拆成小步骤、以及本周就能动手的第一个最小版本。"
  },
  tp: {
    key:"tp", name:"躺平攒钱型", tag:"月光但偶尔能存下",
    quote:"“我不是不想赚，是太累了。”",
    desc:"赚钱对你来说不是发财，是先把每月强制存 500 这件事做到。",
    fullMore:"18 题完整版里会告诉你：你适合哪种低压力副业、怎么平衡赚钱和现有生活、以及适合你的「最小动作」是什么。"
  }
};

var answers = new Array(8).fill(null);
var orders = [];
var current = 0;
var els = {
  cover: document.getElementById("s-cover"),
  quiz: document.getElementById("s-quiz"),
  result: document.getElementById("s-result"),
  qNow: document.getElementById("qNow"),
  qPct: document.getElementById("qPct"),
  qFill: document.getElementById("pFill"),
  qNo: document.getElementById("qNo"),
  qText: document.getElementById("qText"),
  opts: document.getElementById("opts"),
  back: document.getElementById("backBtn"),
  loading: document.getElementById("loading"),
  resultBox: document.getElementById("result"),
  resDate: document.getElementById("resDate")
};

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function initOrders(){ orders = QUESTIONS.map(function(){ return shuffle([0,1,2]); }); }
function show(el){ el.hidden = false; }
function hide(el){ el.hidden = true; }

function startQuiz(){
  answers = new Array(8).fill(null);
  current = 0;
  initOrders();
  hide(els.cover); hide(els.result); show(els.quiz);
  window.scrollTo(0,0);
  renderQuestion();
}

function renderQuestion(){
  var q = QUESTIONS[current];
  els.qNow.textContent = current + 1;
  var pct = Math.round(current / QUESTIONS.length * 100);
  els.qPct.textContent = pct + "%";
  els.qFill.style.width = pct + "%";
  els.qNo.textContent = "Q" + ("0" + (current+1)).slice(-2);
  els.qText.textContent = q.text;
  els.back.disabled = current === 0;
  var html = "";
  orders[current].forEach(function(idx){
    var o = q.options[idx];
    var on = answers[current] === o.score ? " on" : "";
    html += '<button class="opt'+on+'" data-score="'+o.score+'"><span class="dot"></span><span>'+o.text+'</span></button>';
  });
  els.opts.innerHTML = html;
  window.scrollTo(0,0);
}

function choose(score){
  answers[current] = score;
  var nodes = els.opts.querySelectorAll(".opt");
  for(var i=0;i<nodes.length;i++){
    nodes[i].classList.toggle("on", Number(nodes[i].getAttribute("data-score")) === score);
  }
  var idx = current;
  setTimeout(function(){
    if(current !== idx) return;
    if(current < QUESTIONS.length - 1){ current++; renderQuestion(); }
    else { finish(); }
  }, 220);
}

els.opts.addEventListener("click", function(e){
  var btn = e.target.closest(".opt");
  if(!btn) return;
  choose(Number(btn.getAttribute("data-score")));
});
els.back.addEventListener("click", function(){
  if(current > 0){ current--; renderQuestion(); }
});

function calc(){
  var habitRaw = answers[0]+answers[1]+answers[2]+answers[3]; // 4 维各 1 题
  var exprRaw = answers[4]+answers[5]+answers[6]+answers[7];    // 表达 4 题
  var habit = Math.round(habitRaw / 8 * 100);
  var expression = Math.round(exprRaw / 8 * 100);
  var strong = habit >= 50, high = expression >= 50;
  var typeKey = strong ? (high ? "jh" : "wz") : (high ? "kx" : "tp");
  return { habit:habit, expression:expression, type: TYPES[typeKey] };
}

function finish(){
  hide(els.quiz); show(els.loading);
  setTimeout(function(){ hide(els.loading); renderResult(); show(els.result); window.scrollTo(0,0); }, 620);
}

function renderResult(){
  var r = calc();
  var t = r.type;
  var d = new Date();
  els.resDate.textContent = d.getFullYear() + "." + ("0"+(d.getMonth()+1)).slice(-2) + "." + ("0"+d.getDate()).slice(-2);

  els.resultBox.innerHTML =
    '<div class="hero t-'+t.key+'">'+
      '<div class="you">你是</div>'+
      '<h1>'+t.name+'</h1>'+
      '<p class="quote">'+t.quote+'</p>'+
      '<p class="need">'+t.desc+'</p>'+
      '<div class="savehint">截图这一页，就是你的发财类型卡。</div>'+
    '</div>'+

    '<div class="sec">'+
      '<h2>想知道得更具体？</h2>'+
      '<p class="lead">这只是 8 题速测，只给你类型。18 题完整版会告诉你：</p>'+
      '<ul class="perks">'+
        '<li><b>发财时间窗口</b>：更具体的「什么时候能赚到第一笔」</li>'+
        '<li><b>四维短板</b>：你的赚钱路上哪一维拖后腿</li>'+
        '<li><b>本周加速清单</b>：3 件今天就能动手的事</li>'+
        '<li><b>适合一起搞钱的人</b>：哪种人和你互补</li>'+
      '</ul>'+
      '<p class="note8">完整版需要 3 分钟，比速测多 10 道场景题，判断会更准。</p>'+
      '<a href="'+CONFIG.fullUrl+'" class="btn btn-primary" style="margin-top:16px">去测 18 题完整版 →</a>'+
    '</div>'+

    '<div class="res-foot">'+
      '<p class="disclaimer">本测试为原创趣味自我探索工具，题目与结果为行为模式参考，不构成任何金融理财建议、投资建议或财富承诺。投资有风险，入市需谨慎。</p>'+
    '</div>';
}

document.getElementById("startBtn").addEventListener("click", startQuiz);
document.getElementById("restartBtn").addEventListener("click", function(){ hide(els.result); startQuiz(); });
</script>
</body>
</html>
