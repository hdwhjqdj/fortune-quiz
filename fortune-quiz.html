/* ---------------- 四型文案 ---------------- */

/* ---------------- 维度文案 ---------------- */
var DIMS = {
  habit: {
    label:"赚钱习惯",
    low:"你不是赚不到，是钱到手里留不住。每月先存再花，比赚更多更重要。",
    scenes:[
      "生活费发下来，先花再说。",
      "记账坚持不了三天就放弃。"
    ],
    high:"你对钱有基本的控制力，不会月光。"
  },
  opport: {
    label:"机会感知",
    low:"你不是没机会，是看到机会时没反应。别人在刷干货，你在刷娱乐。",
    scenes:[
      "刷到别人赚钱的帖子，划走了。",
      "朋友搞副业，你没上心。"
    ],
    high:"你对机会敏感，不会眼睁睁看着别人吃肉。"
  },
  risk: {
    label:"风险接受",
    low:"你不是胆小，是把「不亏」看得比「赚」更重要。但零风险往往也零回报。",
    scenes:[
      "50% 赚 3000 / 亏 1000，不敢试。",
      "借钱投资，绝对不行。"
    ],
    high:"你能在风险和回报之间做理性判断，不是瞎赌。"
  },
  action: {
    label:"行动力",
    low:"你最大的敌人不是没机会，是「想得太久」。想法不值钱，动手才值钱。",
    scenes:[
      "想到点子，想一周再说。",
      "做一件事没赚到钱，放弃了。"
    ],
    high:"你有「做完比完美重要」的心态，这是最值钱的特质。"
  }
};

var DIM_ORDER = ["habit","opport","risk","action"];

/* ---------------- 状态 ---------------- */
var answers = new Array(18).fill(null);
var orders = [];
var current = 0;
var els = {
  cover: document.getElementById("s-cover"),
  quiz: document.getElementById("s-quiz"),
  result: document.getElementById("s-result"),
  qNow: document.getElementById("qNow"),
  qPct: document.getElementById("qPct"),
  qFill: document.getElementById("pFill"),
  qNo: document.getElementById("qNo"),
  qText: document.getElementById("qText"),
  opts: document.getElementById("opts"),
  back: document.getElementById("backBtn"),
  loading: document.getElementById("loading"),
  resultBox: document.getElementById("result"),
  resDate: document.getElementById("resDate"),
  toast: document.getElementById("toast")
};

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function initOrders(){
  orders = QUESTIONS.map(function(){ return shuffle([0,1,2]); });
}

function show(el){ el.hidden = false; }
function hide(el){ el.hidden = true; }

function startQuiz(){
  answers = new Array(18).fill(null);
  current = 0;
  initOrders();
  hide(els.cover);
  hide(els.result);
  show(els.quiz);
  window.scrollTo(0,0);
  renderQuestion();
}

function renderQuestion(){
  var q = QUESTIONS[current];
  els.qNow.textContent = current + 1;
  var pct = Math.round(current / QUESTIONS.length * 100);
  els.qPct.textContent = pct + "%";
  els.qFill.style.width = pct + "%";
  els.qNo.textContent = "Q" + ("0" + (current+1)).slice(-2);
  els.qText.textContent = q.text;
  els.back.disabled = current === 0;

  var html = "";
  orders[current].forEach(function(idx){
    var o = q.options[idx];
    var on = answers[current] === o.score ? " on" : "";
    html += '<button class="opt'+on+'" data-score="'+o.score+'"><span class="dot"></span><span>'+o.text+'</span></button>';
  });
  els.opts.innerHTML = html;
  window.scrollTo(0,0);
}

function choose(score){
  answers[current] = score;
  var nodes = els.opts.querySelectorAll(".opt");
  for(var i=0;i<nodes.length;i++){
    nodes[i].classList.toggle("on", Number(nodes[i].getAttribute("data-score")) === score);
  }
  var locked = true;
  var idx = current;
  setTimeout(function(){
    if(!locked) return;
    if(current !== idx) return;
    if(current < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    } else {
      finish();
    }
  }, 220);
}

els.opts.addEventListener("click", function(e){
  var btn = e.target.closest(".opt");
  if(!btn) return;
  choose(Number(btn.getAttribute("data-score")));
});

els.back.addEventListener("click", function(){
  if(current > 0){
    current--;
    renderQuestion();
  }
});

/* ---------------- 计分 ---------------- */
function calc(){
  var habitRaw = 0, exprRaw = 0;
  for(var i=0;i<12;i++) habitRaw += answers[i];
  for(var j=12;j<18;j++) exprRaw += answers[j];

  var dims = {};
  DIM_ORDER.forEach(function(d, di){
    var s = 0;
    for(var k=0;k<3;k++) s += answers[di*3 + k];
    dims[d] = Math.round(s / 6 * 100);
  });

  var habit = Math.round(habitRaw / 24 * 100);        // 赚钱体质分
  var expression = Math.round(exprRaw / 12 * 100);    // 发财行动分
  var obstacle = Math.round((100 - expression) * 0.6 + (100 - habit) * 0.4); // 发财阻碍指数

  var strong = habit >= 50, high = expression >= 50;
  var typeKey = strong ? (high ? "jh" : "wz") : (high ? "kx" : "tp");

  var lowKey = DIM_ORDER.reduce(function(a,b){ return dims[b] < dims[a] ? b : a; });
  var highKey = DIM_ORDER.filter(function(d){ return d !== lowKey; })
    .reduce(function(a,b){ return dims[b] > dims[a] ? b : a; }, DIM_ORDER[0] === lowKey ? DIM_ORDER[1] : DIM_ORDER[0]);

  return {
    habit: habit, expression: expression, obstacle: obstacle,
    dims: dims, type: TYPES[typeKey], lowKey: lowKey, highKey: highKey
  };
}

function band(v){
  if(v < 25) return "阻碍很小";
  if(v < 50) return "偶尔卡一下";
  if(v < 75) return "阻碍有点大";
  return "阻碍很大，先别急";
}

function finish(){
  hide(els.quiz);
  show(els.loading);
  setTimeout(function(){
    hide(els.loading);
    renderResult();
    show(els.result);
    window.scrollTo(0,0);
  }, 620);
}

/* ---------------- 结果渲染 ---------------- */
function renderResult(){
  var r = calc();
  var t = r.type;
  var low = DIMS[r.lowKey], high = DIMS[r.highKey];
  var d = new Date();
  els.resDate.textContent = d.getFullYear() + "." + ("0"+(d.getMonth()+1)).slice(-2) + "." + ("0"+d.getDate()).slice(-2);

  var barsHtml = DIM_ORDER.map(function(k){
    var v = r.dims[k];
    var cls = k === r.lowKey ? "low" : (k === r.highKey ? "high" : "");
    return '<div class="bar-row '+cls+'">'+
      '<span class="lb">'+DIMS[k].label+'</span>'+
      '<span class="track"><i class="fill" data-w="'+v+'"></i></span>'+
      '<span class="val">'+v+'</span></div>';
  }).join("");

  var accelHtml = t.accel.map(function(s){ return '<li>'+s+'</li>'; }).join("");
  var scenesHtml = low.scenes.map(function(s){ return '<li>'+s+'</li>'; }).join("");

  els.resultBox.innerHTML =
    '<div class="hero t-'+t.key+'">'+
      '<div class="you">你是</div>'+
      '<h1>'+t.name+'</h1>'+
      '<p class="quote">'+t.quote+'</p>'+
      '<p class="need"><b>发财时间窗口：</b>'+t.time+'</p>'+
      '<p class="need" style="margin-bottom:14px"><b>典型行为：</b>'+t.behavior+'</p>'+
      '<div class="stats">'+
        '<div class="stat"><div class="v">'+r.habit+'<small>/100</small></div><div class="k">赚钱体质</div></div>'+
        '<div class="stat"><div class="v">'+r.expression+'<small>/100</small></div><div class="k">发财行动</div></div>'+
        '<div class="stat"><div class="v">'+r.obstacle+'<small>/100</small></div><div class="k">阻碍指数 · '+band(r.obstacle)+'</div></div>'+
      '</div>'+
      '<div class="savehint">截图这一页，就是你的发财类型卡。</div>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>你的四维赚钱维度</h2><span class="tag">0–100</span></div>'+
      '<p class="lead">分数越高，这一维做得越好。最低的一维是你发财路上的最大阻碍。</p>'+
      '<div class="bars">'+barsHtml+'</div>'+
      '<div class="chips"><span class="chip low">短板 '+low.label+' '+r.dims[r.lowKey]+'</span><span class="chip high">优势 '+high.label+' '+r.dims[r.highKey]+'</span></div>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>你的短板：'+low.label+'</h2><span class="tag">'+r.dims[r.lowKey]+' 分</span></div>'+
      '<p class="lead" style="color:#3a3630">'+low.low+'</p>'+
      '<ul class="scenes">'+scenesHtml+'</ul>'+
      '<p class="lead" style="margin:14px 0 0">你的优势在「'+high.label+'」：'+high.high+'</p>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>加速清单</h2><span class="tag">本周就能做</span></div>'+
      '<p class="lead">三件事，本周挑一件开始，别想太多。</p>'+
      '<ol class="accel">'+accelHtml+'</ol>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>适合一起搞钱的人</h2><span class="tag">互补参考</span></div>'+
      '<p class="fit">'+t.fit+'</p>'+
    '</div>'+

    '<div class="sec">'+
      '<div class="sec-h"><h2>想快速测一下？</h2><span class="tag">朋友也能玩</span></div>'+
      '<p class="lead">把这个测试发给朋友，看看他是什么发财人格。</p>'+
      '<button class="btn-copy" id="copyBtn">复制我的发财类型卡</button>'+
    '</div>'+

    '<div class="res-foot">'+
      '<p class="disclaimer">本测试为原创趣味自我探索工具，题目与结果为行为模式参考，不构成任何金融理财建议、投资建议或财富承诺。结果描述的是你当前更习惯的赚钱方式，不构成对你或他人能力的评价。投资有风险，入市需谨慎。</p>'+
    '</div>';

  // 四维条动画
  requestAnimationFrame(function(){
    setTimeout(function(){
      var fills = els.resultBox.querySelectorAll(".fill");
      for(var i=0;i<fills.length;i++){
        fills[i].style.width = fills[i].getAttribute("data-w") + "%";
      }
    }, 80);
  });

  document.getElementById("copyBtn").addEventListener("click", copyManual);
}

function copyManual(){
  var r = calc();
  var t = r.type;
  var text =
    "我的发财类型卡\n"+
    "我是「"+t.name+"」——"+t.quote.replace(/[“”]/g,"")+"\n"+
    "赚钱体质 "+r.habit+" / 发财行动 "+r.expression+" / 阻碍指数 "+r.obstacle+"（"+band(r.obstacle)+"）\n\n"+
    "发财时间窗口：\n"+t.time+"\n\n"+
    "本周加速清单：\n"+
    t.accel.map(function(s,i){ return (i+1)+". "+s; }).join("\n")+"\n\n"+
    "（来自「发财体质测试」，原创趣味自我探索，非金融理财建议）";

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("已复制，可以发朋友圈或发给朋友"); }, function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly","");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch(e){ ok = false; }
  document.body.removeChild(ta);
  toast(ok ? "已复制，可以发朋友圈或发给朋友" : "复制失败，请长按文字手动复制");
}

var toastTimer = null;
function toast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ els.toast.classList.remove("show"); }, 2200);
}

/* ---------------- 事件 ---------------- */
document.getElementById("startBtn").addEventListener("click", startQuiz);
document.getElementById("restartBtn").addEventListener("click", function(){
  hide(els.result);
  startQuiz();
});
</script>
